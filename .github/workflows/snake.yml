name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # Berjalan otomatis setiap hari
  workflow_dispatch: # Memungkinkan jalankan manual

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate snake game dengan tema Ocean Blue
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: laviendra # Username GitHub Anda
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          # Konfigurasi warna baru untuk tema Ocean Blue
          snake_color: "#1e90ff" # Warna kepala ular (DodgerBlue)
          dots_color: "#e0f7fa" # Warna sel kontribusi paling terang (Light Cyan)
          dots_active_colors:
            - "#81d4fa" # Tingkat 1 (LightBlue)
            - "#4fc3f7" # Tingkat 2 (Cyan)
            - "#29b6f6" # Tingkat 3 (LightBlue)
            - "#0288d1" # Tingkat 4 - paling gelap (Blue)
          grid_color: "#b0bec5" # Warna garis grid (Blue Grey)
          # Mengatur animasi ular lebih halus
          frame_rate: 20
          frame_count: 300

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
